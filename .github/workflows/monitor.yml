name: Facebook Page Monitor

on:
  schedule:
    # Every 30 minutes (UTC). GitHub's minimum is 5 min and runs can be delayed
    # by several minutes under load. Change the number to change the interval.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Send a test alert to Discord/Telegram and exit"
        type: boolean
        default: false
      dry_run:
        description: "Fetch and log only (no alerts, no state changes)"
        type: boolean
        default: false

permissions:
  contents: write   # needed to commit seen_posts.json

concurrency:
  group: fb-page-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        if: ${{ vars.USE_PLAYWRIGHT != 'false' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Chromium
        if: ${{ vars.USE_PLAYWRIGHT != 'false' }}
        run: playwright install --with-deps chromium

      - name: Run monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional overrides (Settings > Secrets and variables > Actions > Variables).
          # Empty values are ignored and config.json is used instead.
          FB_PAGES: ${{ vars.FB_PAGES }}
          STRATEGIES: ${{ vars.STRATEGIES }}
          CHECK_INTERVAL_MINUTES: ${{ vars.CHECK_INTERVAL_MINUTES }}
          NOTIFY_ON_FIRST_RUN: ${{ vars.NOTIFY_ON_FIRST_RUN }}
          MAX_POSTS_PER_RUN: ${{ vars.MAX_POSTS_PER_RUN }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || '' }}
        run: python -m monitor ${{ inputs.test_notify && '--test-notify' || '' }}

      - name: Commit updated state
        if: ${{ always() && !inputs.dry_run && !inputs.test_notify }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_posts.json
          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "chore: update seen posts [skip ci]"
            git pull --rebase --autostash
            git push
          fi
